# Configuration file

general {
    # Send a chat message to the player when a quest is completed. [default: true]
    B:announceQuestCompletion=true

    # Grant rewards automatically as soon as a quest is completed, without opening the book. [default: false]
    B:autoClaimRewards=false

    # Announce completed quests to every player on the server. [default: false]
    B:broadcastQuestCompletion=false

    # Automatically track every task that can be derived from the player state: items in the inventory, experience level and the current dimension. [default: true]
    B:detectItemTasks=true

    # Play a level up sound when a quest is completed. [default: true]
    B:enableSounds=true
    B:giveBookOnFirstJoin=true

    # Hand out the vanilla achievement of a quest as soon as the quest is completed. [default: true]
    B:grantAchievements=true

    # How often (in ticks) the inventory is scanned for automatic quest tasks. [range: 5 ~ 600, default: 20]
    I:itemCheckInterval=20

    # Log invalid quest definitions to the log file. [default: true]
    B:logQuestErrors=true

    # Show the quest book button in the top left corner of the player inventory. [default: true]
    B:showInventoryButton=true
}


